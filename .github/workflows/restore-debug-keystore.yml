name: CI: Build debug APK with fixed keystore
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
      DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
      DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore fixed debug keystore (if provided)
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "Restoring debug.keystore from secret..."
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
            chmod 600 debug.keystore
            ls -l debug.keystore
            # show keystore alias (optional, won't fail the job if keytool returns non-zero)
            keytool -list -keystore debug.keystore -storepass "${DEBUG_KEYSTORE_PASSWORD:-android}" || true
          else
            echo "DEBUG_KEYSTORE_BASE64 is not set — build will use default debug keystore or env overrides."
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
